version = 1
clobber = true

[[items]]
source = "alacritty-alacritty.toml"
destination = "$XDG_CONFIG_HOME/alacritty/alacritty.toml"
template = "alacritty-alacritty.toml.mustache"
themed = true

[[items]]
source = "bat-config"
destination = "$XDG_CONFIG_HOME/bat/config"

[[items]]
source = "hidden-files"
destination = "$HOME/.hidden"

[[items]]
source = "bat-themes-Base16.tmTheme"
destination = "$XDG_CONFIG_HOME/bat/themes/Base16.tmTheme"
template = "bat-themes-Base16.tmTheme.mustache"
themed = true

[[items]]
source = "gtk-3.0-settings.ini"
destination = "$XDG_CONFIG_HOME/gtk-3.0/settings.ini"
template = "gtk-3.0-settings.ini.mustache"
themed = true

[[items]]
source = "gtk-4.0-gtk-dark.css"
destination = "$XDG_CONFIG_HOME/gtk-4.0/gtk-dark.css"
template = "gtk-4.0-gtk-dark.css.mustache"

[[items]]
source = "gtk-4.0-gtk.css"
destination = "$XDG_CONFIG_HOME/gtk-4.0/gtk.css"
template = "gtk-4.0-gtk.css.mustache"

[[items]]
source = "gtk-4.0-settings.ini"
destination = "$XDG_CONFIG_HOME/gtk-4.0/settings.ini"
template = "gtk-4.0-settings.ini.mustache"
themed = true

[[items]]
source = "noctalia-config.toml"
destination = "$XDG_CONFIG_HOME/noctalia/config.toml"
template = "noctalia-config.toml.mustache"
themed = true

[[items]]
source = "umbriel-umbriel-colors.toml"
destination = "$XDG_CONFIG_HOME/umbriel/umbriel-colors.toml"
template = "umbriel-umbriel-colors.toml.mustache"
themed = true

[[items]]
source = "qt5ct-qt5ct.conf"
destination = "$XDG_CONFIG_HOME/qt5ct/qt5ct.conf"
template = "qt5ct-qt5ct.conf.mustache"
themed = true

[[items]]
source = "qt6ct-qt6ct.conf"
destination = "$XDG_CONFIG_HOME/qt6ct/qt6ct.conf"
template = "qt6ct-qt6ct.conf.mustache"
themed = true

[[items]]
source = "zathura-zathurarc"
destination = "$XDG_CONFIG_HOME/zathura/zathurarc"
template = "zathura-zathurarc.mustache"
themed = true
